<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortcut</title>
<meta name="description" content="A small game about the long way round.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root { --night: #0b0f1c; --lamp: #ffd38a; --paper: #f6ecd6; --muted: #a9a3b8; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); overflow: hidden; display: grid; place-items: center; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; outline: none; cursor: default; }
  #pc-only { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--night); text-align: center; }
  #pc-only[hidden] { display: none; }
  #pc-only div { max-width: 26rem; }
  #pc-only h1 { font-family: "Lora", Georgia, serif; font-weight: 500; font-size: 2.2rem; margin: 0 0 .75rem; }
  #pc-only p { color: var(--muted); line-height: 1.55; margin: 0; }
  #pc-only button { margin-top: 1.5rem; background: none; border: 1px solid var(--muted); color: var(--muted); border-radius: 999px; padding: .5rem 1rem; font: inherit; font-size: .85rem; cursor: pointer; }
  #pc-only strong { color: var(--lamp); font-weight: 700; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Shortcut, a small platform game"></canvas>
<div id="pc-only" hidden>
  <div>
    <h1>Shortcut</h1>
    <p>This game is made for a computer with a keyboard. Please open this link on a <strong>laptop or desktop</strong>.</p>
    <button id="play-anyway" type="button">Open it here anyway</button>
  </div>
</div>
<script>
  (function () {
    var mm = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
    var hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var touchOnly = hasTouch && !mm('(any-pointer: fine)') && !mm('(any-hover: hover)');
    var note = document.getElementById('pc-only');
    if (touchOnly) note.hidden = false;
    document.getElementById('play-anyway').addEventListener('click', function () { note.hidden = true; });
    window.addEventListener('load', function () { var c = document.getElementById('game'); if (c) c.focus(); });
  })();
</script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/more.js"></script>
<script src="js/extra.js"></script>
<script src="js/voices.js"></script>
</body>
</html>
